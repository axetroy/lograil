name: Release

# Runs when a version tag (v*) is pushed. It verifies the code, publishes the
# package to npm, and deploys versioned + latest docs to GitHub Pages.

on:
  push:
    tags:
      - 'v*'

# `contents: write` lets the docs job push to the `docs` branch.
# `id-token: write` is unused today but reserved for npm OIDC provenance.
permissions:
  contents: write
  id-token: write

# One release per tag; never cancel an in-flight publish/docs deploy.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Regenerate CHANGELOG from git history
        run: yarn changelog

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG)"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-docs:
    name: Deploy Docs
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate versions.json
        run: |
          node -e "const cp=require('child_process');const fs=require('fs');const tags=cp.execSync('git tag -l v*').toString().trim().split('\n').filter(Boolean).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));fs.writeFileSync('docs/public/versions.json',JSON.stringify(tags));console.log('versions:',tags.join(', '));"

      - name: Build docs (latest, served at root)
        run: yarn vitepress build docs --base "/${{ github.event.repository.name }}/"

      - name: Deploy latest to docs branch root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_branch: docs
          publish_dir: docs/.vitepress/dist
          destination_dir: .
          keep_files: true
          commit_message: 'docs: update root to ${{ github.ref_name }}'

      - name: Build docs (versioned, served under /<repo>/<tag>/)
        run: yarn vitepress build docs --base "/${{ github.event.repository.name }}/${{ github.ref_name }}/"

      - name: Deploy versioned docs to docs branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_branch: docs
          publish_dir: docs/.vitepress/dist
          destination_dir: ${{ github.ref_name }}
          keep_files: true
          commit_message: 'docs: publish ${{ github.ref_name }}'
