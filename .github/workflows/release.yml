name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  changesets:
    name: Check for Changesets
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pending changesets
        id: check
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: Create or update version PR
    needs: changesets
    if: needs.changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create or update version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commitMode: github-api

  publish:
    name: Publish to npm
    needs: changesets
    if: needs.changesets.outputs.has_changesets != 'true'
    runs-on: ubuntu-latest
    # Configure this GitHub environment as the npm trusted publisher environment.
    environment: npm
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.21.1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and publish with npm trusted publishing
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: yarn release
          commitMode: github-api

  deploy-docs:
    name: Deploy Docs
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build latest docs
        run: yarn vitepress build docs --base "/${{ github.event.repository.name }}/"

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: docs
          publish_dir: docs/.vitepress/dist
          destination_dir: .
          force_orphan: true
          commit_message: 'docs: update after release'
