name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Pure docs/markdown changes don't need the full verify matrix.
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Cancel in-progress runs for the same ref (e.g. superseded commits / PR
# updates) to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
