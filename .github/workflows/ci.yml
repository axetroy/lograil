name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Pure docs/markdown changes don't need the full verify matrix.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      electron_real:
        description: Also run the real Electron integration test (downloads the Electron binary).
        type: boolean
        default: false

# Cancel in-progress runs for the same ref (e.g. superseded commits / PR
# updates) to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      electron_real: ${{ inputs.electron_real }}
