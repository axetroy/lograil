name: Verify

# Reusable verification pipeline shared by CI (ci.yml) and Release
# (release.yml). Lint and build run once on a single fast runner; the test
# matrix covers OS/Node combinations. Type-checking validates types on every
# supported Node version without paying for a full dual (ESM+CJS) emit there.

on:
  workflow_call:
    inputs:
      electron_real:
        description: Run the real Electron integration test (downloads the Electron binary).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  test:
    name: Test & Typecheck (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24, 26]
    env:
      # Skip the Electron binary download during install (we only need its types).
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Typecheck (src + tests)
        run: yarn typecheck && yarn typecheck:test

  coverage:
    name: Coverage (with thresholds)
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Skip the Electron binary download during install (we only need its types).
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Runs the suite with v8 coverage. The thresholds declared in
      # vitest.config.ts fail the job if coverage drops below the guardrails.
      - name: Test with coverage
        run: yarn test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  build:
    name: Build (ESM + CJS)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

  electron-real:
    name: Electron real app (optional)
    runs-on: windows-latest
    if: inputs.electron_real == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Test (real Electron)
        run: yarn vitest run test/integration/electron-real.test.ts
        env:
          RUN_ELECTRON_INTEGRATION: '1'
