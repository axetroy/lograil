<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="lograil logo">
  <defs>
    <linearGradient id="lr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="20" y="20" width="216" height="216" rx="60" fill="url(#lr-bg)" />

  <!-- Train wheel - outer ring -->
  <circle cx="128" cy="128" r="56" fill="none" stroke="#ffffff" stroke-width="12" />
  
  <!-- Inner hub -->
  <circle cx="128" cy="128" r="20" fill="#ffffff" />
  
  <!-- Spokes (6) -->
  <line x1="128" y1="72" x2="128" y2="108" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="128" y1="148" x2="128" y2="184" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="72" y1="128" x2="108" y2="128" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="148" y1="128" x2="184" y2="128" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="88" y1="88" x2="112" y2="112" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="144" y1="144" x2="168" y2="168" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

  <!-- Track lines below wheel -->
  <line x1="48" y1="200" x2="208" y2="200" stroke="rgba(255,255,255,0.5)" stroke-width="6" stroke-linecap="round" />
  <line x1="48" y1="212" x2="208" y2="212" stroke="rgba(255,255,255,0.5)" stroke-width="6" stroke-linecap="round" />
</svg>