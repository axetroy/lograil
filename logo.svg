<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="lograil logo">
  <defs>
    <linearGradient id="lr-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Rounded-square badge -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#lr-badge)" />

  <!-- Log console (centered): terminal prompt (>) + 3 colored log-level lines -->
  <path d="M84 112 L102 128 L84 144" fill="none" stroke="#0f172a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <g stroke-width="9" stroke-linecap="round">
    <line x1="116" y1="108" x2="176" y2="108" stroke="#10b981" />
    <line x1="116" y1="128" x2="162" y2="128" stroke="#f59e0b" />
    <line x1="116" y1="148" x2="170" y2="148" stroke="#ef4444" />
  </g>
</svg>